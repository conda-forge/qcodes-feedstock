schema_version: 1

context:
  name: qcodes
  version: "0.62.0"

package:
  name: qcodes
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 5b89a86a2bd66c1e1f47efea1c9f98e7ec01e2dc711640aefcf37af69acd86f3

build:
  number: 0
  skip: match(python, "<3.12")
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    # macOS CI needs c_stdlib_version for SDK setup, even for pure-Python builds.
    - if: osx
      then: ${{ stdlib('c') }}
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
  host:
    - python
    - pip
    - versioningit >=2.2.1
    - setuptools >=77.0.0
  run:
    - python
    - numpy >=1.26.0
    - pyvisa >=1.12.0,<1.17
    - h5py >=3.10.0
    - websockets >=11.0
    - jsonschema >=4.9.0
    - ruamel.yaml >=0.16.0,!=0.16.6
    - pandas >=2.1.1
    - xarray >=2023.08.0
    - cf_xarray >=0.8.4
    - tabulate >=0.9.0
    - tqdm >=4.59.0
    - matplotlib-base >=3.8.0
    - typing_extensions >=4.12.0
    - packaging >=20.0
    - ipykernel >=6.12.0
    - ipywidgets >=8.0.0,<9.0.0
    - broadbean >=0.11.0
    - uncertainties >=3.2.0
    - h5netcdf >=1.3.0
    - opentelemetry-api >=1.17.0
    - dask >=2022.1.0
    - pillow >=10.2.0
    - networkx >=3.1
    - pyarrow >=14.0.0

tests:
  - python:
      imports:
        - qcodes
      pip_check: false

about:
  homepage: http://microsoft.github.io/Qcodes
  license: MIT
  license_file: LICENSE
  summary: Modular data acquisition and analysis framework
  description: |
    QCoDeS is a Python-based data acquisition framework developed
    by the Copenhagen / Delft / Sydney / Microsoft quantum computing
    consortium. While it has been developed to serve the needs of
    nanoelectronic device experiments, it is not inherently limited
    to such experiments, and can be used anywhere a system with many
    degrees of freedom is controllable by computer.
  documentation: http://microsoft.github.io/Qcodes
  repository: https://github.com/microsoft/Qcodes

extra:
  recipe-maintainers:
    - CinaArjmand
    - basnijholt
    - jenshnielsen
    - astafan8
    - einsmein
    - picarro-yren
    - samantha-ho
