{% set name = "qcodes" %}
{% set version = "0.59.0" %}

package:
  name: qcodes
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 249823792049640820ccad1725d13a8088099598d97db501d42ab59d979afab8

build:
  number: 0
  skip: true  # [py<=311]
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
  host:
    - python
    - pip
    - versioningit
    - setuptools
  run:
    - python
    - numpy >=1.22.4
    - pyvisa >=1.11.0,<1.17
    - h5py >=3.8.0
    - websockets >=11.0
    - jsonschema >=4.9.0
    - ruamel.yaml >=0.16.0,!=0.16.6
    - pandas >=1.5.0
    - xarray >=2023.08.0
    - cf_xarray >=0.8.4
    - tabulate >=0.9.0
    - tqdm >=4.59.0
    - matplotlib-base >=3.6.0
    - typing_extensions >=4.6.0
    - packaging >=20.0
    - ipywidgets >=8.0.0,<9.0.0
    - broadbean >=0.11.0
    - uncertainties >=3.2.0
    - h5netcdf >=0.14.1
    - opentelemetry-api >=1.17.0
    - dask >=2022.1.0
    - pillow >=9.2.0
    - networkx >=3.1

test:
  imports:
    - qcodes

about:
  home: http://microsoft.github.io/Qcodes
  license: MIT
  license_file: LICENSE
  summary: Modular data acquisition and analysis framework
  description: |
    QCoDeS is a Python-based data acquisition framework developed
    by the Copenhagen / Delft / Sydney / Microsoft quantum computing
    consortium. While it has been developed to serve the needs of
    nanoelectronic device experiments, it is not inherently limited
    to such experiments, and can be used anywhere a system with many
    degrees of freedom is controllable by computer.
  doc_url: http://microsoft.github.io/Qcodes
  dev_url: https://github.com/microsoft/Qcodes

extra:
  recipe-maintainers:
    - basnijholt
    - jenshnielsen
    - astafan8
    - einsmein
    - picarro-yren
    - samantha-ho
