{% set name = "qcodes" %}
{% set version = "0.61.1" %}

package:
  name: qcodes
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 231c06ca9d39726614ec659fad9968127c1092619d221e35757b0ddc2b99d57c

build:
  number: 0
  skip: true  # [py<=311]
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  build:
    # macOS CI needs c_stdlib_version for SDK setup, even for pure-Python builds.
    - {{ stdlib('c') }}  # [osx]
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
  host:
    - python
    - pip
    - versioningit >=2.2.1
    - setuptools >=77.0.0
  run:
    - python
    - numpy >=1.26.0
    - pyvisa >=1.12.0,<1.17
    - h5py >=3.10.0
    - websockets >=11.0
    - jsonschema >=4.9.0
    - ruamel.yaml >=0.16.0,!=0.16.6
    - pandas >=2.1.1
    - xarray >=2023.08.0
    - cf_xarray >=0.8.4
    - tabulate >=0.9.0
    - tqdm >=4.59.0
    - matplotlib-base >=3.8.0
    - typing_extensions >=4.6.0
    - packaging >=20.0
    - ipykernel >=6.12.0
    - ipywidgets >=8.0.0,<9.0.0
    - broadbean >=0.11.0
    - uncertainties >=3.2.0
    - h5netcdf >=1.3.0
    - opentelemetry-api >=1.17.0
    - dask >=2022.1.0
    - pillow >=10.2.0
    - networkx >=3.1
    - pyarrow >=14.0.0

test:
  imports:
    - qcodes

about:
  home: http://microsoft.github.io/Qcodes
  license: MIT
  license_file: LICENSE
  summary: Modular data acquisition and analysis framework
  description: |
    QCoDeS is a Python-based data acquisition framework developed
    by the Copenhagen / Delft / Sydney / Microsoft quantum computing
    consortium. While it has been developed to serve the needs of
    nanoelectronic device experiments, it is not inherently limited
    to such experiments, and can be used anywhere a system with many
    degrees of freedom is controllable by computer.
  doc_url: http://microsoft.github.io/Qcodes
  dev_url: https://github.com/microsoft/Qcodes

extra:
  recipe-maintainers:
    - basnijholt
    - jenshnielsen
    - astafan8
    - einsmein
    - picarro-yren
    - samantha-ho
